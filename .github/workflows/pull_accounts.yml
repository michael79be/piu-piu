name: Pull Accounts

on:
  workflow_dispatch:
  repository_dispatch:
    types: [pull-accounts]

permissions:
  contents: write

concurrency:
  group: pull-accounts
  cancel-in-progress: true

jobs:
  pull-accounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install trystero werift --no-save

      - run: node pull_accounts.mjs accounts/public.json 60000

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push if changed
        run: |
          git add accounts/public.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update accounts/public.json [skip ci]"
            git push
          fi